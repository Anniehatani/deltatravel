name: Live Production Data Probe
on:
  push:
    branches:
      - manh/integrate-production-api
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: AI configured
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://delta-travel-api.onrender.com/api/v1"
          status="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 "$BASE/assistant/provider-status")"
          echo "$status" | jq -e '((.data.groqConfigured // .groqConfigured) == true)'
      - name: Catalog has tours
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://delta-travel-api.onrender.com/api/v1"
          tours="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 "$BASE/tours?page=1&pageSize=100")"
          echo "$tours" | jq -e '((.data.total // 0) > 0)'
      - name: Catalog has schedules
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://delta-travel-api.onrender.com/api/v1"
          tours="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 "$BASE/tours?page=1&pageSize=100")"
          tour_id="$(echo "$tours" | jq -r '.data.items[0].id // empty')"
          test -n "$tour_id"
          schedules="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 "$BASE/tours/$tour_id/schedules?page=1&pageSize=100")"
          echo "$schedules" | jq -e '((.data.total // 0) > 0)'
