name: Live Full E2E Verification
on:
  push:
    branches:
      - manh/integrate-production-api

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed frontend and backend end-to-end
        shell: bash
        env:
          API: https://delta-travel-api.onrender.com/api/v1
          WEB: https://delta-travel-web.onrender.com
          ORIGIN: https://delta-travel-web.onrender.com
        run: |
          set -euo pipefail

          retry_curl() {
            curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$@"
          }

          echo "1. Frontend routes"
          retry_curl "$WEB/" -o home.html
          test "$(wc -c < home.html)" -gt 1000
          retry_curl "$WEB/tours" -o tours.html
          test "$(wc -c < tours.html)" -gt 1000

          echo "2. API readiness"
          retry_curl "$API/health/ready" | tee ready.json
          jq -e '.data.status == "ok"' ready.json

          echo "3. CORS preflight"
          curl --fail --silent --show-error -D cors.headers -o /dev/null             -X OPTIONS "$API/auth/register"             -H "Origin: $ORIGIN"             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type,x-csrf-protection'
          grep -qi "^access-control-allow-origin: $ORIGIN" cors.headers

          echo "4. Groq provider status"
          retry_curl "$API/assistant/provider-status" | tee provider.json
          jq -e '.data.preferredProvider == "GROQ" and .data.groqConfigured == true' provider.json

          echo "5. Public catalog"
          retry_curl "$API/tours?page=1&pageSize=100" | tee catalog.json
          jq -e '.data.total > 0 and (.data.items | length) > 0' catalog.json
          TOUR_ID="$(jq -r '.data.items[0].id' catalog.json)"
          retry_curl "$API/tours/$TOUR_ID/schedules?page=1&pageSize=100" | tee schedules.json
          jq -e '.data.total > 0 and (.data.items | length) > 0' schedules.json
          SCHEDULE_ID="$(jq -r '.data.items[0].id' schedules.json)"

          echo "6. Register customer from real web origin"
          EMAIL="e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT@example.com"
          PASSWORD='E2E_TestPassword_2026!'
          cat > register.json <<JSON
          {"name":"E2E Render User","email":"$EMAIL","password":"$PASSWORD"}
          JSON
          curl --fail --silent --show-error -D register.headers -c cookies.txt             -X POST "$API/auth/register"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             --data @register.json | tee register-response.json
          grep -qi "^access-control-allow-origin: $ORIGIN" register.headers
          grep -qi '^set-cookie: refresh_token=' register.headers
          TOKEN="$(jq -r '.data.accessToken' register-response.json)"
          test -n "$TOKEN" && test "$TOKEN" != "null"
          jq -e --arg e "$EMAIL" '.data.user.email == $e' register-response.json

          echo "7. Refresh cookie rotation"
          curl --fail --silent --show-error -b cookies.txt -c cookies.txt             -X POST "$API/auth/refresh"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             --data '{}' | tee refresh.json
          TOKEN="$(jq -r '.data.accessToken' refresh.json)"
          test -n "$TOKEN" && test "$TOKEN" != "null"

          echo "8. Auth and profile"
          retry_curl "$API/auth/me" -H "Authorization: Bearer $TOKEN" | tee me.json
          jq -e --arg e "$EMAIL" '.data.email == $e' me.json
          retry_curl "$API/profile/me" -H "Authorization: Bearer $TOKEN" | tee profile.json
          jq -e --arg e "$EMAIL" '.data.email == $e' profile.json

          echo "9. Real Groq-backed assistant"
          curl --fail --silent --show-error --max-time 70             -X POST "$API/assistant/chat"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             -H "Authorization: Bearer $TOKEN"             --data '{"message":"Tìm tour phù hợp cho 2 người lớn ở Việt Nam","history":[]}' | tee chat.json
          jq -e '.data.mode == "GROQ" and (.data.reply | length) > 0' chat.json

          echo "10. Quote"
          curl --fail --silent --show-error             -X POST "$API/bookings/quote"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             --data "{\"scheduleId\":\"$SCHEDULE_ID\",\"adults\":1,\"children\":0}" | tee quote.json
          jq -e '.data.totalAmount > 0 and .data.availableSeats > 0' quote.json

          echo "11. Booking and idempotent replay"
          IDEM="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          cat > booking.json <<JSON
          {"scheduleId":"$SCHEDULE_ID","adults":1,"children":0,"contactName":"E2E Render User","contactEmail":"$EMAIL","contactPhone":"0901234567"}
          JSON
          curl --fail --silent --show-error             -X POST "$API/bookings"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             -H "Authorization: Bearer $TOKEN"             -H "Idempotency-Key: $IDEM"             --data @booking.json | tee booking-created.json
          BOOKING_ID="$(jq -r '.data.id' booking-created.json)"
          test -n "$BOOKING_ID" && test "$BOOKING_ID" != "null"
          jq -e '.data.status == "PENDING_PAYMENT"' booking-created.json

          curl --fail --silent --show-error             -X POST "$API/bookings"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             -H "Authorization: Bearer $TOKEN"             -H "Idempotency-Key: $IDEM"             --data @booking.json | tee booking-replay.json
          jq -e --arg id "$BOOKING_ID" '.data.id == $id' booking-replay.json

          echo "12. CASH payment"
          curl --fail --silent --show-error             -X POST "$API/payments"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             -H "Authorization: Bearer $TOKEN"             --data "{\"bookingId\":\"$BOOKING_ID\",\"provider\":\"CASH\"}" | tee payment.json
          jq -e '.data.provider == "CASH" and .data.checkoutUrl == null' payment.json

          retry_curl "$API/bookings/$BOOKING_ID" -H "Authorization: Bearer $TOKEN" | tee booking-cash.json
          jq -e '.data.status == "AWAITING_CASH" and .data.cashDueAt != null' booking-cash.json

          echo "13. Supabase avatar signed upload, persistence, delete"
          export API ORIGIN TOKEN
          node --input-type=module <<'NODE'
          const API = process.env.API;
          const ORIGIN = process.env.ORIGIN;
          const token = process.env.TOKEN;
          const headers = (json = false) => ({
            Origin: ORIGIN,
            'X-CSRF-Protection': '1',
            ...(json ? {'Content-Type':'application/json'} : {}),
            Authorization: 'Bearer ' + token,
          });
          async function req(path, init={}) {
            const res = await fetch(API + path, init);
            const text = await res.text();
            const payload = text ? JSON.parse(text) : {};
            if (!res.ok) throw new Error(path + ' HTTP ' + res.status + ' ' + text.slice(0,300));
            return payload.data;
          }
          const bytes = Uint8Array.from(Buffer.from(
            'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2nWQAAAAASUVORK5CYII=',
            'base64'
          ));
          const ticket = await req('/profile/avatar/upload-url', {
            method:'POST',
            headers:headers(true),
            body:JSON.stringify({contentType:'image/png', sizeBytes:bytes.byteLength}),
          });
          const form = new FormData();
          form.append('cacheControl','3600');
          form.append('', new Blob([bytes], {type:'image/png'}), 'e2e-avatar.png');
          const up = await fetch(ticket.signedUrl, {method:'PUT', headers:{'x-upsert':'false'}, body:form});
          if (!up.ok) throw new Error('Supabase upload HTTP ' + up.status + ' ' + (await up.text()).slice(0,300));
          const completed = await req('/profile/avatar/complete', {
            method:'POST', headers:headers(true), body:JSON.stringify({uploadId:ticket.uploadId})
          });
          if (!completed.avatarUrl || completed.avatarId !== ticket.uploadId) throw new Error('avatar completion mismatch');
          const me = await req('/auth/me', {headers:headers(false)});
          if (me.avatarUrl !== completed.avatarUrl) throw new Error('avatar not persisted');
          const removed = await req('/profile/avatar', {method:'DELETE',headers:headers(false)});
          if (removed.avatarUrl !== null || removed.avatarId !== null) throw new Error('avatar not deleted');
          console.log('avatar end-to-end PASS');
          NODE

          echo "14. Cancel test booking to release inventory"
          curl --fail --silent --show-error             -X POST "$API/bookings/$BOOKING_ID/cancel"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             -H "Authorization: Bearer $TOKEN"             --data '{"reason":"E2E verification cleanup"}' | tee cancelled.json
          jq -e '.data.status == "CANCELLED"' cancelled.json

          echo "15. Logout"
          curl --fail --silent --show-error -b cookies.txt -c cookies.txt             -X POST "$API/auth/logout"             -H "Origin: $ORIGIN"             -H 'X-CSRF-Protection: 1'             -H 'Content-Type: application/json'             --data '{}' | tee logout.json
          jq -e '.data.ok == true' logout.json

          echo "FULL_LIVE_E2E_PASS"
