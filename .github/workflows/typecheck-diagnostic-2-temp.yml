name: Temporary Typecheck Diagnostic 2
on:
  push:
    branches:
      - manh/integrate-production-api
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          npm run typecheck > TYPECHECK_DIAGNOSTIC_2.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> TYPECHECK_DIAGNOSTIC_2.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TYPECHECK_DIAGNOSTIC_2.txt
          git commit -m "ci: capture second typecheck diagnostic"
          git push origin HEAD:manh/integrate-production-api
