name: Temporary Final Formatter

on:
  push:
    branches:
      - manh/final-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/final-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format hardening files
        run: |
          npx prettier --write README.md SUMMARY.md docs/VERIFICATION.md docs/DEPLOYMENT.md docs/PRODUCTION_READINESS.md scripts/live-smoke.mjs scripts/staging-e2e.mjs scripts/scan-secrets.mjs .github/workflows/ci.yml .github/workflows/live-verification.yml .github/workflows/staging-e2e.yml package.json apps/web/next.config.ts
          rm .github/workflows/temp-final-formatter.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SUMMARY.md docs/VERIFICATION.md docs/DEPLOYMENT.md docs/PRODUCTION_READINESS.md scripts/live-smoke.mjs scripts/staging-e2e.mjs scripts/scan-secrets.mjs .github/workflows/ci.yml .github/workflows/live-verification.yml .github/workflows/staging-e2e.yml package.json apps/web/next.config.ts .github/workflows/temp-final-formatter.yml
          git commit -m "style: format final hardening files"
          git push origin HEAD:manh/final-hardening
