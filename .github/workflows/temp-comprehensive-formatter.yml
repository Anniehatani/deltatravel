name: Temporary Comprehensive Formatter

on:
  push:
    branches:
      - manh/final-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/final-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format final hardening tree
        run: npm run format
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-comprehensive-formatter.yml
      - name: Commit formatted tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format comprehensive final hardening"
          git push origin HEAD:manh/final-hardening
