name: Temporary Staging E2E Formatter

on:
  push:
    branches:
      - manh/integrate-production-api

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/staging-e2e.mjs
      - run: rm .github/workflows/temp-staging-e2e-formatter.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format extended staging E2E"
          git push origin HEAD:manh/integrate-production-api
