name: Agent UX Formatter Temporary
on:
  push:
    branches:
      - manh/agent-ux-checkpoints
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/agent-ux-checkpoints
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/agent-booking-panel.tsx
          git commit -m "style: format AI agent checkpoint UX"
          git push origin HEAD:manh/agent-ux-checkpoints
