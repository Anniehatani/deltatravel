name: Temporary Final Acceptance Formatter

on:
  push:
    branches:
      - manh/final-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tour
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: tour_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tour -d tour_booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://tour:ci_only@localhost:5432/tour_booking_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_only_secret_with_at_least_32_characters
      WEB_ORIGIN: http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: manh/final-hardening
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Normalize repository formatting
        run: npm run format
      - run: npm run docs:generate
      - run: npx prettier --write docs/API_CONTRACT.md docs/openapi.json
      - run: npm run format:check
      - run: npm run verify:contract
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - name: Remove temporary finalizer
        run: rm .github/workflows/temp-final-acceptance.yml
      - name: Commit normalized verified tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated or formatting changes to commit."
          else
            git commit -m "chore: finalize verified hardening tree"
            git push origin HEAD:manh/final-hardening
          fi
