name: Temporary Security Formatter

on:
  push:
    branches:
      - manh/final-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/final-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/next.config.ts scripts/live-smoke.mjs docs/VERIFICATION.md docs/PRODUCTION_READINESS.md docs/TEST_PLAN.md
      - run: rm .github/workflows/temp-security-formatter.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format security hardening files"
          git push origin HEAD:manh/final-hardening
