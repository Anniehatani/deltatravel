name: Temporary Contract Sync
on:
  push:
    branches:
      - manh/integrate-production-api
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate API contract
        run: npm run docs:generate
      - name: Commit generated contract
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: regenerate API contract"
          git push origin HEAD:manh/integrate-production-api
