name: Temporary Final Live Verification

on:
  push:
    branches:
      - manh/final-hardening

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/final-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed production surface
        run: npm run verify:live
        env:
          LIVE_WEB_URL: https://delta-travel-web.onrender.com
          LIVE_API_URL: https://delta-travel-api.onrender.com/api/v1
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-final-live-verification.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary final live verification workflow"
          git push origin HEAD:manh/final-hardening
