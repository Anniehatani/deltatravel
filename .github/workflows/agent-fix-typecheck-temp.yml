name: Agent Fix Typecheck Diagnostic Temporary
on:
  push:
    branches:
      - manh/agent-ux-fix2
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/agent-ux-fix2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Capture typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > AGENT_FIX_TYPECHECK.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> AGENT_FIX_TYPECHECK.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENT_FIX_TYPECHECK.txt
          git commit -m "ci: capture agent fix typecheck diagnostic"
          git push origin HEAD:manh/agent-ux-fix2
