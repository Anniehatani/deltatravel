name: Temporary Payment Formatter
on:
  push:
    branches:
      - manh/integrate-production-api
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format payment page
        run: npx prettier --write apps/web/src/app/admin/payments/page.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/admin/payments/page.tsx
          git commit -m "style: format cash payment admin page"
          git push origin HEAD:manh/integrate-production-api
