name: Temporary Formatter
on:
  push:
    branches:
      - manh/integrate-production-api
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format integration changes
        run: |
          npx prettier --write \
            apps/web/src/lib/api.ts \
            apps/web/src/lib/system-config.ts \
            apps/web/src/components/auth-form.tsx \
            apps/web/src/providers/auth-provider.tsx \
            apps/web/src/components/account-modal.tsx \
            apps/web/src/components/nav.tsx \
            apps/web/src/app/assistant/page.tsx \
            'apps/web/src/app/(account)/bookings/page.tsx' \
            'apps/web/src/app/(account)/bookings/[id]/page.tsx' \
            apps/web/src/app/admin/bookings/page.tsx \
            'apps/web/src/app/(public)/tours/page.tsx' \
            packages/shared/src/index.ts \
            netlify.toml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format production integration"
          git push origin HEAD:manh/integrate-production-api
