name: Temporary Final Format
on:
  push:
    branches:
      - manh/integrate-production-api
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manh/integrate-production-api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/generate-contract.mjs docs/API_CONTRACT.md docs/openapi.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-contract.mjs docs/API_CONTRACT.md docs/openapi.json
          git commit -m "style: format contract generator and docs"
          git push origin HEAD:manh/integrate-production-api
